<!DOCTYPE html>
<html>
<head>
  <title>CSS Cascade Practice</title>
  <link rel="stylesheet" href="practice.css">
  <style>
    p {
      text-align: center;
      color: green;
    }
  </style>
</head>
<body>
  <h1>Cascading Style Sheets</h1>
  <p>This paragraph has styles from more than one place.</p>
  <p style="color: red;">This paragraph has an inline colour.</p>
</body>
</html>
