<!DOCTYPE html>
<html>
<head>
  <title>Course Information</title>
  <style>
    /* changing background color to white */
    body {
      background-color: white;
    }

    p {
      color: black;
      margin-left: 20px;
    }

    /* CSS rule to give all h1, h2 dark green color*/
    h1, h2 {
      color: darkgreen;
    }

    h1 {
      text-align: center;
      font-size: 28pt;
    }

    
    .info {
      color: navy;
    }

   
    #course-code {
      text-align: center;
      color: red;
    }

  
    .notice {
      background-color: lightyellow;
    }
  </style>
</head>
<body>
  <h1>Web Technologies</h1>
  <h2>Course Details</h2>
  <p id="course-code">Module Code: CIS3532</p>
  <p class="info">Learn to create structured web pages.</p>
  <p class="info">Learn to style web pages with CSS.</p>
  <p class="notice">Submit your practical work before the deadline.</p>
  <hr>
  <h2>Learning Outcomes</h2>
  <p class="info">Understand CSS selectors and declarations.</p>
</body>
</html>
