<!DOCTYPE html>
<html>
<head>
  <title>Campus News</title>
  <style>
    /* Heading rules: the grouped rule gives h1, h2 and h3 the same color,
       then h1 and h2 get their own alignment and font sizes. */
    h1, h2, h3 {
      color: darkblue;
    }

    h1 {
      text-align: center;
      font-size: 30pt;
    }

    h2 {
      font-size: 20pt;
    }

    p {
      text-align: left;
      margin-left: 20px;
    }

    /* Separate h3 rule, placed after the grouped rule so it wins */
    h3 {
      color: green;
    }
  </style>
</head>
<body>
  <h1>Campus News</h1>
  <h2>Upcoming Events</h2>
  <p>Web Technologies workshop will be held on Monday.</p>
  <p>Student research presentations will take place next month.</p>
  <h2>Announcements</h2>
  <p>Check the LMS for the latest course materials.</p>
  <h3>Stay Updated</h3>
  <p>Contact your lecturer if you need clarification.</p>
</body>
</html>
